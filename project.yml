name: NumberOthello
options:
  bundleIdPrefix: com.thanano
  deploymentTarget:
    iOS: "17.0"
packages:
  NumberOthelloCore:
    path: Core
targets:
  NumberOthello:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: NumberOthelloCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thanano.NumberOthello
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 数字オセロ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
