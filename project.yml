# プロジェクト・スキーム・モジュール名の NumberOthello は開発用の内部名（利用者には表示しない）。
# 表示名は「トオカエシ」、製品名（.app・実行ファイル名）は Tokaeshi。名前の由来と商標の扱いは README 冒頭を参照。
name: NumberOthello
options:
  bundleIdPrefix: jp.andygrave
  developmentLanguage: ja
  deploymentTarget:
    iOS: "26.5"
packages:
  NumberOthelloCore:
    path: Core
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.10.0
  # Unity Ads 4.20.1 / adapter 4.20.1.0。更新を再現できるよう公式パッケージのコミットを固定。
  GoogleMobileAdsMediationUnity:
    url: https://github.com/googleads/googleads-mobile-ios-mediation-unity.git
    revision: e7d16cc0820c89154969844801a71b1172b368fa
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
targets:
  NumberOthello:
    type: application
    platform: iOS
    sources: [App]
    scheme:
      testTargets:
        - NumberOthelloTests
        - NumberOthelloUITests
      # StoreKit テスト構成（App Store Connect と通信せずシミュレータで購入・復元を試せる）。
      # 実機の実 App Store には影響しない
      storeKitConfiguration: App/Monetization/StoreKitTest.storekit
    dependencies:
      - package: NumberOthelloCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleMobileAdsMediationUnity
        product: UnityAdapterTarget
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_NAME: Tokaeshi
        # UnityAdapterの静的Objective-Cカテゴリ（gameIds等）を確実にリンクする。
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        PRODUCT_BUNDLE_IDENTIFIER: jp.andygrave.tokaeshi
        DEVELOPMENT_TEAM: 377M4Z6S57
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: トオカエシ
        # 広告 SDK（AdMob）・StoreKit の通信は OS 標準の暗号化（HTTPS）のみで、独自の暗号化は使っていない。
        # そのため NO を宣言し、アップロードごとの輸出コンプライアンス確認を省く
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # ATT（App Tracking Transparency）の許可ダイアログに表示する説明文（spec §11.3）
        INFOPLIST_KEY_NSUserTrackingUsageDescription: パーソナライズされた広告を表示するために使用します
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        # MARKETING_VERSION は利用者に見えるバージョン。ビルド番号はアップロードのたびに
        # scripts/testflight.sh が git のコミット数から渡す（ここの値はローカルビルド用）
        MARKETING_VERSION: "1.1.4"
        CURRENT_PROJECT_VERSION: "1"
    postBuildScripts:
      - name: QA enrollment resource
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          output="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/QATestDevice.plist"
          case " ${SWIFT_ACTIVE_COMPILATION_CONDITIONS:-} " in
            *" MEDIATION_QA "*)
              if [ -n "${QA_ENROLLMENT_FILE:-}" ]; then
                cp "$QA_ENROLLMENT_FILE" "$output"
              else
                rm -f "$output"
              fi
              ;;
            *) rm -f "$output" ;;
          esac
    # GENERATE_INFOPLIST_FILE と共存する追加の Info.plist（GADApplicationIdentifier・SKAdNetworkItems は
    # INFOPLIST_KEY_ 形式で表現できないため、Xcode のモダンな Info.plist 生成にこのファイルをマージする）
    info:
      path: App/Info.plist
      properties:
        GADApplicationIdentifier: ca-app-pub-5364369331405756~1425596375
        # Google 公式ページ（https://developers.google.com/admob/ios/quick-start）の一覧を 2026-09-29 に取得・全件転記
