# プロジェクト・スキーム・モジュール名の NumberOthello は開発用の内部名（利用者には表示しない）。
# 表示名は「トオカエシ」、製品名（.app・実行ファイル名）は Tokaeshi。名前の由来と商標の扱いは README 冒頭を参照。
name: NumberOthello
options:
  bundleIdPrefix: jp.andygrave
  developmentLanguage: ja
  deploymentTarget:
    iOS: "26.5"
packages:
  NumberOthelloCore:
    path: Core
targets:
  NumberOthello:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: NumberOthelloCore
    settings:
      base:
        PRODUCT_NAME: Tokaeshi
        PRODUCT_BUNDLE_IDENTIFIER: jp.andygrave.tokaeshi
        DEVELOPMENT_TEAM: 377M4Z6S57
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: トオカエシ
        # 標準の暗号化以外を使っていない（通信なし）ため、アップロードごとの輸出コンプライアンス確認を省く
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        # MARKETING_VERSION は利用者に見えるバージョン。ビルド番号はアップロードのたびに
        # scripts/testflight.sh が git のコミット数から渡す（ここの値はローカルビルド用）
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
