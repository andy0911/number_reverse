  NumberOthelloTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: NumberOthello
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        # PRODUCT_NAME を Tokaeshi に変えているため、ターゲット名から自動算出される既定の TEST_HOST では見つからない
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tokaeshi.app/Tokaeshi"
        BUNDLE_LOADER: "$(TEST_HOST)"
